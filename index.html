                    if (selectedReqs.length > 0 && !selectedReqs.every(r => opt.reqs.includes(r))) return false;
                    return true;

                    return 0;

                                        <h3 className="font-bold text-gray-900 text-sm mb-4">Resumen del encargo</h3>
                                        <div className="space-y-4">
                                            {(ojoMode === 'ambos' || ojoMode === 'od') && (
                                                <div className="pb-4 border-b border-gray-200">
                                                    <div className="flex items-center gap-2 mb-1.5">
                                                        <span className="font-bold text-gray-900 text-sm">OD · {selectedLens?.producto}</span>
                                                        <span className="bg-[#d1fae5] text-[#065f46] px-2 py-0.5 text-[10px] font-bold rounded">{selectedLens?.familia}</span>
                                                    </div>
                                                    <div className="text-xs text-gray-500 mb-0.5">{modalSpecs.odIndice || 'Índice base'} · {modalSpecs.odTratamiento || 'Tratamiento base'}</div>
                                                    <div className="text-xs text-gray-500 mb-2">Sin servicio adicional</div>
                                                    <div className="text-xs text-gray-700">Precio por lente · <span className="font-bold">{selectedLens?.precio} €</span> sin IVA</div>
                                                    <div className="text-xs text-gray-500">{selectedLens?.eciones || '0 EuroCiones'}</div>
                                                </div>
                                            )}
                                            {(ojoMode === 'ambos' || ojoMode === 'oi') && (
                                                <div className="pb-4 border-b border-gray-200">
                                                    <div className="flex items-center gap-2 mb-1.5">
                                                        <span className="font-bold text-gray-900 text-sm">OI · {selectedLens?.producto}</span>
                                                        <span className="bg-[#d1fae5] text-[#065f46] px-2 py-0.5 text-[10px] font-bold rounded">{selectedLens?.familia}</span>
                                                    </div>
                                                    <div className="text-xs text-gray-500 mb-0.5">{modalSpecs.oiIndice || 'Índice base'} · {modalSpecs.oiTratamiento || 'Tratamiento base'}</div>
                                                    <div className="text-xs text-gray-500 mb-2">Sin servicio adicional</div>
                                                    <div className="text-xs text-gray-700">Precio por lente · <span className="font-bold">{selectedLens?.precio} €</span> sin IVA</div>
                                                    <div className="text-xs text-gray-500">{selectedLens?.eciones || '0 EuroCiones'}</div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="mt-4 flex flex-wrap justify-between items-center gap-4">
                                            <div className="font-bold text-gray-900 text-sm">
                                                Total · {formatPrice(modalTotalPrice)} € sin IVA
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border-t border-gray-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shrink-0 z-10">
                                    <div><p className="text-xs font-bold text-gray-700">Precio trabajos de taller y lentes</p></div>
                                    <div className="flex items-center gap-5">
                                        <div className="text-right flex items-baseline gap-2 whitespace-nowrap">
                                            <span className="text-xs text-gray-400 line-through">{formatPrice(modalTotalPrice + 4.20 * activeEyesCount)} € PVP</span>
                                            <span className="text-xl font-black text-[#312e81]">{formatPrice(modalTotalPrice)} € <span className="text-xs font-bold text-gray-500">PVO</span></span>
                                        </div>
                                        <div className="flex gap-2.5">
                                            <button onClick={() => setModalOpen(false)} className="px-5 py-2 bg-white border border-gray-300 rounded-md text-xs font-bold text-gray-700 hover:bg-gray-50 transition">Añadir a presupuesto</button>
                                            <button onClick={handleAddToCart} className="px-6 py-2 bg-[#312e81] rounded-md text-xs font-bold text-white hover:bg-indigo-900 shadow-sm transition">Añadir al carrito</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CONFIGURACIÓN LENTES DE CONTACTO (Con opción de configurar graduación si no se introdujo antes) */}
                    {lcModalOpen && selectedLc && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden animate-fade-in">
                                <div className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">{selectedLc.prop ? 'Producto propio Cione' : 'Terceros'}</span>
                                            <span className="text-[10px] font-semibold text-gray-500">{selectedLc.cat} · {selectedLc.material}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-gray-900 mt-1">{selectedLc.nombre}</h3>
                                        <p className="text-xs text-gray-500">{selectedLc.ref} · {selectedLc.lab} · {selectedLc.tipo} · {selectedLc.formato}</p>
                                    </div>
                                    <button onClick={() => setLcModalOpen(false)} className="px-3.5 py-1.5 border border-gray-300 rounded text-xs font-semibold text-gray-700 hover:bg-gray-50">Cerrar</button>
                                </div>

                                <div className="p-6 bg-gray-50/40 overflow-y-auto space-y-4">
                                    {(!lcGrad.odEsf && !lcGrad.oiEsf && !lcGrad.odCil && !lcGrad.oiCil) && (
                                        <div className="bg-indigo-50/80 border border-indigo-200/80 rounded-lg px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
                                            <div className="text-xs text-indigo-950">
                                                <span className="font-bold">Graduación pendiente:</span> No has introducido graduación previa. Puedes configurarla directamente aquí antes de añadir al carrito.
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {/* Ojo derecho (OD) */}
                                        <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                                            <div className="flex items-center justify-between mb-3">
                                                <div className="font-bold text-xs text-[#312e81]">Ojo derecho (OD)</div>
                                                <button type="button" onClick={() => setLcGrad(prev => ({ ...prev, oiEsf: prev.odEsf, oiCil: prev.odCil, oiEje: prev.odEje, oiAdd: prev.odAdd, oiRadio: prev.odRadio, oiDiam: prev.odDiam }))} className="text-[10px] font-bold text-[#312e81] bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 px-2.5 py-1 rounded transition-colors">
                                                    Copiar OD → OI
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2 mb-3">
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Esfera</label>
                                                    <input type="text" placeholder="0,00" value={lcGrad.odEsf} onChange={e => setLcGrad({ ...lcGrad, odEsf: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Cilindro</label>
                                                    <input type="text" placeholder="-" value={lcGrad.odCil} onChange={e => setLcGrad({ ...lcGrad, odCil: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Eje</label>
                                                    <input type="text" placeholder="-" value={lcGrad.odEje} onChange={e => setLcGrad({ ...lcGrad, odEje: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Adición</label>
                                                    <input type="text" placeholder="-" value={lcGrad.odAdd} onChange={e => setLcGrad({ ...lcGrad, odAdd: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold bg-indigo-50/30 focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-[#312e81] mb-0.5">Radio (R)</label>
                                                    <input type="text" placeholder="8,6" value={lcGrad.odRadio} onChange={e => setLcGrad({ ...lcGrad, odRadio: e.target.value })} className="w-full border border-indigo-200 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-[#312e81] mb-0.5">Diámetro (Ø)</label>
                                                    <input type="text" placeholder="14,2" value={lcGrad.odDiam} onChange={e => setLcGrad({ ...lcGrad, odDiam: e.target.value })} className="w-full border border-indigo-200 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                            </div>
                                            <div className="pt-2.5 border-t border-gray-100 flex items-center justify-between">
                                                <label className="text-[11px] font-bold text-gray-700">Cantidad de cajas (OD)</label>
                                                <div className="flex items-center gap-2">
                                                    <button type="button" onClick={() => setLcBoxes(p => ({ ...p, od: Math.max(0, p.od - 1) }))} className="w-7 h-7 border border-gray-300 rounded bg-gray-50 hover:bg-gray-100 font-bold">−</button>
                                                    <span className="w-8 text-center text-xs font-bold">{lcBoxes.od}</span>
                                                    <button type="button" onClick={() => setLcBoxes(p => ({ ...p, od: p.od + 1 }))} className="w-7 h-7 border border-gray-300 rounded bg-gray-50 hover:bg-gray-100 font-bold">+</button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Ojo izquierdo (OI) */}
                                        <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                                            <div className="flex items-center justify-between mb-3">
                                                <div className="font-bold text-xs text-[#312e81]">Ojo izquierdo (OI)</div>
                                                <button type="button" onClick={() => setLcGrad(prev => ({ ...prev, odEsf: prev.oiEsf, odCil: prev.oiCil, odEje: prev.oiEje, odAdd: prev.oiAdd, odRadio: prev.oiRadio, odDiam: prev.oiDiam }))} className="text-[10px] font-bold text-[#312e81] bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 px-2.5 py-1 rounded transition-colors">
                                                    Copiar OI → OD
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2 mb-3">
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Esfera</label>
                                                    <input type="text" placeholder="0,00" value={lcGrad.oiEsf} onChange={e => setLcGrad({ ...lcGrad, oiEsf: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Cilindro</label>
                                                    <input type="text" placeholder="-" value={lcGrad.oiCil} onChange={e => setLcGrad({ ...lcGrad, oiCil: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Eje</label>
                                                    <input type="text" placeholder="-" value={lcGrad.oiEje} onChange={e => setLcGrad({ ...lcGrad, oiEje: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-gray-600 mb-0.5">Adición</label>
                                                    <input type="text" placeholder="-" value={lcGrad.oiAdd} onChange={e => setLcGrad({ ...lcGrad, oiAdd: e.target.value })} className="w-full border border-gray-300 rounded px-2 py-1.5 text-xs text-center font-semibold bg-indigo-50/30 focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-[#312e81] mb-0.5">Radio (R)</label>
                                                    <input type="text" placeholder="8,6" value={lcGrad.oiRadio} onChange={e => setLcGrad({ ...lcGrad, oiRadio: e.target.value })} className="w-full border border-indigo-200 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-[#312e81] mb-0.5">Diámetro (Ø)</label>
                                                    <input type="text" placeholder="14,2" value={lcGrad.oiDiam} onChange={e => setLcGrad({ ...lcGrad, oiDiam: e.target.value })} className="w-full border border-indigo-200 rounded px-2 py-1.5 text-xs text-center font-semibold focus:border-[#312e81] outline-none" />
                                                </div>
                                            </div>
                                            <div className="pt-2.5 border-t border-gray-100 flex items-center justify-between">
                                                <label className="text-[11px] font-bold text-gray-700">Cantidad de cajas (OI)</label>
                                                <div className="flex items-center gap-2">
                                                    <button type="button" onClick={() => setLcBoxes(p => ({ ...p, oi: Math.max(0, p.oi - 1) }))} className="w-7 h-7 border border-gray-300 rounded bg-gray-50 hover:bg-gray-100 font-bold">−</button>
                                                    <span className="w-8 text-center text-xs font-bold">{lcBoxes.oi}</span>
                                                    <button type="button" onClick={() => setLcBoxes(p => ({ ...p, oi: p.oi + 1 }))} className="w-7 h-7 border border-gray-300 rounded bg-gray-50 hover:bg-gray-100 font-bold">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border-t border-gray-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shrink-0">
                                    <div>
                                        <span className="text-xs text-gray-500">Total sin IVA ({lcBoxes.od + lcBoxes.oi} cajas): </span>
                                        <span className="text-lg font-black text-[#312e81]">{formatPrice(parsePrice(selectedLc.precio) * (lcBoxes.od + lcBoxes.oi))} €</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setLcModalOpen(false)} className="px-4 py-2 border border-gray-300 rounded-md text-xs font-bold text-gray-700 hover:bg-gray-50">Cancelar</button>
                                        <button onClick={handleAddLcToCart} className="px-5 py-2 bg-[#312e81] text-white rounded-md text-xs font-bold hover:bg-indigo-900 shadow-sm">Añadir al carrito</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showTracer && <TracerSimulator onClose={() => setShowTracer(false)} onComplete={handleTracerComplete} />}
                    {showEspesor && <CalculoEspesorModal onClose={() => setShowEspesor(false)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
